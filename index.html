<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#fffdf8">
  <title>Heppie Teppie</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #fffdf8;
      color: #092c5c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    .smile { font-size: 3rem; }
    h1 { margin: 16px 0 10px; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; }
    p { margin: 0; color: #5e6b7b; font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="smile" aria-hidden="true">☺</div>
    <h1>Hoi!</h1>
    <p>De Teppie-informatiepagina is alleen bedoeld voor mensen die de persoonlijke link van Tijmen hebben ontvangen.</p>
  </main>
</body>
</html>
